services:
  web:
    image: ${IMAGE:-ghcr.io/arqon-labs/arqon:latest}
    container_name: arqon-web
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: arqon-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:

volumes:
  caddy-data:
  caddy-config:
